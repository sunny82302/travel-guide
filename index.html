<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSH Business Travel SOP Guide</title>
    <style>
        :root {
            --primary-color: #F26A3D;
            --primary-hover: #d95529;
            --primary-light: #fff4f0;
            --primary-border: #fbc4b2;
            --dark-grey: #2d3136;
            --text-main: #33373d;
            --text-muted: #5f6672;
            --bg-page: #f5f6f8;
            --secondary-color: #fafafa;
            --accent-color: #d97706;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 18px rgba(45, 49, 54, 0.08);
            border-top: 5px solid var(--primary-color);
            padding: 22px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 6px;
        }

        .lang-toggle {
            background-color: #ffffff;
            border: 1.5px solid var(--dark-grey);
            color: var(--dark-grey);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .lang-toggle:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: var(--primary-light);
        }

        .lang-toggle .active-lang {
            color: var(--primary-color);
        }

        h1 {
            color: var(--dark-grey);
            text-align: center;
            margin-top: 4px;
            margin-bottom: 22px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 14px;
            font-size: 1.45rem;
            letter-spacing: 0.3px;
        }

        h1 .brand-badge {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            font-size: 0.85rem;
            padding: 2px 9px;
            border-radius: 4px;
            vertical-align: middle;
            margin-right: 8px;
            font-weight: 700;
        }

        h3, h4 {
            color: var(--dark-grey);
        }

        .step-container {
            margin-bottom: 20px;
        }

        .step-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--dark-grey);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 120px;
            padding: 12px 10px;
            border: 2px solid #e2e5e9;
            background-color: #ffffff;
            color: var(--dark-grey);
            font-weight: bold;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 0.9rem;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: var(--primary-light);
        }

        .btn:active, .btn.active {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .card {
            background-color: var(--secondary-color);
            border: 1px solid #e5e7eb;
            border-left: 5px solid var(--primary-color);
            padding: 16px;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            margin-top: 15px;
        }

        .warning-card {
            background-color: #fffbeb;
            border-left: 5px solid var(--accent-color);
            padding: 12px;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .emergency-card {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            border-left: 5px solid #dc2626;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 0.88rem;
            color: #7f1d1d;
        }

        .notice-box {
            background-color: var(--primary-light);
            border: 1px dashed var(--primary-color);
            padding: 10px 12px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 0.9rem;
            color: var(--dark-grey);
        }

        .notice-box strong {
            color: #c2410c;
        }

        .path-info {
            background-color: #f1f3f5;
            color: var(--dark-grey);
            border: 1px solid #dcdfe4;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .qr-box {
            text-align: center;
            margin: 14px 0;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .qr-box img {
            max-width: 175px;
            width: 100%;
            height: auto;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 6px;
            background: #ffffff;
        }

        .qr-caption {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 600;
        }

        .ref-img-box {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 10px;
            margin: 8px 0;
            text-align: center;
        }

        .ref-img-box img {
            max-width: 100%;
            height: auto;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
        }

        .ref-img-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
            text-align: left;
        }

        .template-box {
            background: #ffffff;
            border: 1px dashed #9ca3af;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            position: relative;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: var(--text-main);
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--dark-grey);
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            background: #ffffff;
            font-size: 0.85rem;
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 7px 8px;
            text-align: center;
        }

        th {
            background-color: var(--dark-grey);
            color: #ffffff;
            font-weight: 600;
        }

        ul, ol {
            padding-left: 18px;
            margin: 8px 0;
        }

        li {
            margin-bottom: 6px;
        }

        a {
            color: var(--primary-color);
            text-decoration: underline;
            font-weight: 600;
        }

        a:hover {
            color: var(--primary-hover);
        }

        .reset-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            background-color: var(--dark-grey);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #1f2226;
        }

        .calc-box {
            background: #ffffff;
            border: 1px solid #d1d5db;
            padding: 14px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .calc-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .calc-row label {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--dark-grey);
        }

        .calc-row select, .calc-row input {
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .calc-result {
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            color: var(--primary-hover);
            font-weight: bold;
            font-size: 1.05rem;
            padding: 11px;
            border-radius: 6px;
            text-align: center;
            margin-top: 10px;
        }

        .form-card table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .form-card th, .form-card td { border: 1px solid #4b5563; padding: 7px 9px; font-size: 13px; text-align: left; }
        .form-card th { background-color: #f3f4f6; width: 28%; font-weight: bold; color: var(--dark-grey); }
        .form-card th.section-banner { background-color: var(--dark-grey); color: #ffffff; text-align: center; }
        .form-card th.sub-banner { background-color: var(--primary-light); color: var(--primary-hover); }
        .form-card input[type="text"], .form-card input[type="date"], .form-card input[type="email"], .form-card select, .form-card textarea {
            width: 100%; padding: 5px 6px; border: 1px solid #9ca3af; border-radius: 3px; box-sizing: border-box; font-size: 13px; font-family: inherit; color: var(--text-main);
        }
        .form-card input:focus, .form-card select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .print-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        .print-btn:hover { background-color: var(--primary-hover); }

        .sub-action-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.88rem;
            display: inline-block;
            margin-top: 6px;
            transition: background-color 0.2s ease;
        }
        .sub-action-btn:hover { background-color: var(--primary-hover); }

        .print-only-header { display: none; }

        @media print {
            .no-print, .top-bar, .btn-group, .step-container, h1, .reset-btn, .warning-card, .emergency-card, .notice-box, .btn-container, .print-btn, .sub-action-btn, .copy-btn, .template-box, .hide-on-print { display: none !important; }
            body { background-color: #ffffff; padding: 0; margin: 0; color: #000000; }
            .container { box-shadow: none; border: none; padding: 0; max-width: 100%; }
            .card { border: none; padding: 0; background: transparent; margin: 0; }
            .print-only-header { display: block !important; text-align: center; border-bottom: 2px solid #F26A3D; padding-bottom: 8px; margin-bottom: 14px; }
            .form-card th { background-color: #f3f4f6 !important; color: #111827 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .form-card th.section-banner { background-color: #2d3136 !important; color: #ffffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .form-card th.sub-banner { background-color: #fff4f0 !important; color: #c2410c !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            input, select, textarea { border: none !important; background: transparent !important; appearance: none; -webkit-appearance: none; padding: 0 !important; color: #000000 !important; }
            textarea { resize: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar no-print">
        <button class="lang-toggle" id="lang-toggle-btn" onclick="toggleLanguage()" title="Switch Language / 切換語言">
            🌐 <span id="lang-zh-label" class="active-lang">繁中</span> ｜ <span id="lang-en-label">EN</span>
        </button>
    </div>

    <h1><span class="brand-badge">BSH</span><span id="app-title">出差互動指引系統</span></h1>

    <!-- 步驟一：選擇出差類型 -->
    <div class="step-container" id="type-select">
        <div class="step-title" id="step1-title">步驟 1：請問您本次需求是？</div>
        <div class="btn-group">
            <button class="btn" id="btn-domestic">國內出差</button>
            <button class="btn" id="btn-overseas">海外出差</button>
            <button class="btn" id="btn-traveler-profile">📝 旅客訂位建檔表 (首次透過金龍旅行社訂位時須提供)</button>
            <button class="btn" id="btn-transfer">🚘 預約機場接送</button>
            <button class="btn" id="btn-allowance">💰 差旅津貼試算</button>
            <button class="btn" id="btn-visa">🪪 辦理護照 / 台胞證</button>
        </div>
    </div>

    <!-- 步驟二（國內）：選住宿狀況 -->
    <div class="step-container" id="domestic-options" style="display: none;">
        <div class="notice-box" id="domestic-notice"></div>
        <div class="step-title" id="domestic-step2-title">步驟 2：請選擇您的住宿需求與狀態</div>
        <div class="btn-group">
            <button class="btn" id="btn-dom-der" onclick="showDomesticResult('derhotel')">預訂 DER Hotel 夥伴飯店 (過夜)</button>
            <button class="btn" id="btn-dom-special" onclick="showDomesticResult('special')">自行尋找住宿（DER滿房/價格過高）</button>
            <button class="btn" id="btn-dom-oneday" onclick="showDomesticResult('oneday')">當日來回行程 (無需過夜)</button>
        </div>
    </div>

    <!-- 步驟二（海外）：選擇執行階段 -->
    <div class="step-container" id="overseas-options" style="display: none;">
        <div class="warning-card" id="overseas-warning"></div>
        <div class="step-title" id="overseas-step2-title">步驟 2：您目前處於出差的哪一個階段？</div>
        <div class="btn-group">
            <button class="btn" id="btn-ov-hotel" onclick="showOverseasResult('hotel')">1. 飯店預訂 (BSH 集團訂房網)</button>
            <button class="btn" id="btn-ov-flight" onclick="showOverseasResult('flight')">2. 機票預訂 (金龍旅行社)</button>
            <button class="btn" id="btn-ov-wf" onclick="showOverseasResult('wf')">3. 提交出差申請單 &amp; 開票</button>
            <button class="btn" id="btn-ov-transfer" onclick="showOverseasResult('transfer_stage')">4. 預約專車機場接送</button>
            <button class="btn" id="btn-ov-after" onclick="showOverseasResult('after')">5. 返國費用核銷</button>
        </div>
    </div>

    <datalist id="address-options">
        <option value="台北市內湖區洲子街80號 (BSH 總辦公室 / Taipei HQ)">
        <option value="台北市內湖區瑞光路258巷55號 (CS Office)">
        <option value="桃園國際機場第一航廈 (Taoyuan Airport T1)">
        <option value="桃園國際機場第二航廈 (Taoyuan Airport T2)">
        <option value="台北松山機場 (Taipei Songshan Airport TSA)">
        <option value="臺北市中山區敬業四路168號 (台北大直維多麗亞酒店 / Grand Victoria Hotel)">
        <option value="台北市中山區植福路200號 (台北大直英迪格酒店 / Hotel Indigo Taipei North)">
    </datalist>

    <div id="result-area" style="display: none;"></div>

    <button class="reset-btn" id="reset-btn" style="display: none;" onclick="resetForm()">🔄 重新選擇流程</button>
</div>

<script>
    var currentLang = localStorage.getItem('bsh_travel_sop_lang') || 'zh-TW';
    var currentView = { type: null, sub: null };

    var I18N = {
        'zh-TW': {
            pageTitle: 'BSH 出差 SOP 互動指引助手',
            appTitle: '出差互動指引系統',
            step1Title: '步驟 1：請問您本次需求是？',
            btnDomestic: '國內出差',
            btnOverseas: '海外出差',
            btnTravelerProfile: '📝 旅客訂位建檔表 (首次透過金龍旅行社訂位時須提供)',

            overseasWarning: '<strong>🔒 全球 Travel Security 安全規範提醒：</strong><br>出發前請先至 <a href="https://crisis24horizon.com" target="_blank">Crisis24 Horizon</a> 確認出差地風險等級：<br>• <strong> Moderate 風險地區</strong>：須完成 Learning Hub 課程 <i>Travel Security Basics</i> (ID: LSO_60010737)，並於出差申請單附上有效證照。<br>• <strong> High 以上地區</strong>：非極特殊必要需求，一律禁止前往。',

            resetBtn: '🔄 重新選擇流程',
            copiedAlert: '內容已複製！',
            copyBtnText: '複製範本',
            selectTimeText: '選擇時間',
            allowanceOutputPrefix: '預估可申請津貼總額：NT$ '
        },
        'en': {
            pageTitle: 'BSH Business Travel SOP Guide',
            appTitle: 'Business Travel SOP Guide',
            step1Title: 'Step 1: What would you like to arrange today?',
            btnDomestic: 'Domestic Travel',
            btnOverseas: 'International Travel',
            btnTravelerProfile: '📝 Traveler Profile Form (First-Time Booking via Grand Travel)',
            btnTransfer: '🚘 Airport Transfer Booking',
            btnAllowance: '💰 Per Diem Calculator',
            btnVisa: '🪪 Passport / Mainland Travel Permit',
            domesticNotice: '<strong>📋 Domestic Travel Policy Essentials:</strong><br>• <strong>Overnight Stay:</strong> You must submit a Travel Application in <strong>both Power Platform and Apollo (Attendance System)</strong> for manager approval prior to booking accommodation.<br>• <strong>Same-Day Return:</strong> No formal travel request is required, though you must notify your line manager verbally or via email beforehand.',
            domesticStep2Title: 'Step 2: Select your accommodation scenario',
            btnDomDer: 'Book via DER Hotel Portal (Overnight)',
            btnDomSpecial: 'Self-Arranged Hotel (DER Full / Over Budget)',
            btnDomOneday: 'Same-Day Return Trip (No Overnight Stay)',
            overseasWarning: '<strong>🔒 Global Travel Security Compliance:</strong><br>Before departure, check your destination’s risk rating on <a href="https://crisis24horizon.com" target="_blank">Crisis24 Horizon</a>:<br>• <strong>Moderate-Risk Destinations:</strong> You must complete the Learning Hub course <i>Travel Security Basics</i> (ID: LSO_60010737) and attach your valid certificate to the Travel Application.<br>• <strong>High-Risk & Above:</strong> Strictly prohibited unless approved under extraordinary business-critical circumstances.',
            overseasStep2Title: 'Step 2: Which stage of your trip are you currently at?',
            btnOvHotel: '1. Hotel Booking (DER Hotel Portal)',
            btnOvFlight: '2. Flight Booking (Grand Travel)',
            btnOvWf: '3. Travel Approval & Ticketing',
            btnOvTransfer: '4. Airport Chauffeur Transfer',
            btnOvAfter: '5. Post-Trip Expense Reimbursement',
            resetBtn: '🔄 Start Over',
            copiedAlert: 'Copied to clipboard!',
            copyBtnText: 'Copy Template',
            selectTimeText: 'Select time',
            allowanceOutputPrefix: 'Estimated Total Per Diem: NT$ '
        }
    };

    document.addEventListener('DOMContentLoaded', function() {
        bindClick('btn-domestic', function() { selectType('domestic'); });
        bindClick('btn-overseas', function() { selectType('overseas'); });
        bindClick('btn-traveler-profile', function() { selectType('traveler-profile'); });
        bindClick('btn-transfer', function() { selectType('transfer'); });
        bindClick('btn-allowance', function() { selectType('allowance'); });
        bindClick('btn-visa', function() { selectType('visa'); });
        applyStaticTranslations();
    });

    function bindClick(id, fn) {
        var el = document.getElementById(id);
        if (el) {
            el.addEventListener('click', fn);
        }
    }

    function toggleLanguage() {
        var formState = captureFormState();
        currentLang = (currentLang === 'zh-TW') ? 'en' : 'zh-TW';
        localStorage.setItem('bsh_travel_sop_lang', currentLang);
        applyStaticTranslations();

        if (currentView.type) {
            if (currentView.type === 'domestic') {
                document.getElementById('btn-domestic').classList.add('active');
                document.getElementById('domestic-options').style.display = 'block';
                if (currentView.sub) showDomesticResult(currentView.sub);
            } else if (currentView.type === 'overseas') {
                document.getElementById('btn-overseas').classList.add('active');
                document.getElementById('overseas-options').style.display = 'block';

    function captureFormState() {
        var area = document.getElementById('result-area');
        if (!area || area.style.display === 'none') return null;
        var inputs = area.querySelectorAll('input, select, textarea');
        var state = [];
        for (var i = 0; i < inputs.length; i++) {
            var el = inputs[i];
            if (el.type === 'checkbox' || el.type === 'radio') {
                state.push({ checked: el.checked });
            } else {
                state.push({ value: el.value });
            }
        }
        return state;
    }

    function restoreFormState(state) {
        if (!state) return;
        var area = document.getElementById('result-area');
        var inputs = area.querySelectorAll('input, select, textarea');
        for (var i = 0; i < inputs.length && i < state.length; i++) {
            var el = inputs[i];
            if (el.type === 'checkbox' || el.type === 'radio') {
                el.checked = state[i].checked;
            } else if (state[i].value !== undefined) {
                el.value = state[i].value;
            }
        }
        if (document.getElementById('calc-output')) {
            calculateAllowance();
        }
    }

    function copyToClipboard(elementId) {
        var t = I18N[currentLang];
        var box = document.getElementById(elementId);
        var btn = box.querySelector('.copy-btn');
        var btnLabel = btn ? btn.innerText : '';
        var text = box.innerText.replace(btnLabel, '').trim();
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(function() { alert(t.copiedAlert); });
        } else {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert(t.copiedAlert);
        }
    }

    function calculateAllowance() {
        var baseRate = parseFloat(document.getElementById('calc-region').value);
        var days = parseInt(document.getElementById('calc-days').value) || 1;

        var bfRate = baseRate * 0.10;
        var luRate = baseRate * 0.30;
        var dnRate = baseRate * 0.30;
        var dailyMisc = baseRate * 0.30;

        var total = 0;

        if (days === 1) {
            total += dailyMisc * 0.5;
            if (document.getElementById('chk-dep-bf').checked) total += bfRate;
            total += luRate;
            if (document.getElementById('chk-ret-dn').checked) total += dnRate;
        } else {
            total += dailyMisc; 
            total += luRate + dnRate;
            if (document.getElementById('chk-dep-bf').checked) total += bfRate;

            total += bfRate + luRate;
            if (document.getElementById('chk-ret-dn').checked) total += dnRate;

            var middleDays = days - 2;
            if (middleDays > 0) {
                total += middleDays * baseRate;
            }
        }

        var noBf = parseInt(document.getElementById('no-bf').value) || 0;
        var noLu = parseInt(document.getElementById('no-lu').value) || 0;
        var noDn = parseInt(document.getElementById('no-dn').value) || 0;

        total -= (noBf * bfRate + noLu * luRate + noDn * dnRate);

        if (total < 0) total = 0;

        document.getElementById('calc-output').innerText = I18N[currentLang].allowanceOutputPrefix + total.toLocaleString();
    }
